name: Trazer icones
on:
  push:
    paths: ['.github/workflows/icones.yml']
permissions:
  contents: write
jobs:
  icones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon.png; do
            curl -fsSL -o "$f" "https://visionary-liger-700c94.netlify.app/$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -m "Icones do app" || echo "nada novo"
          git push
